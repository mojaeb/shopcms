<style>
:root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #333333;
    --muted: #888888;
    --border: #e0e0e0;
    --radius: 8px;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.1);
    --header-fg: rgba(255, 255, 255, 0.92);
    --focus: color-mix(in srgb, var(--accent) 35%, transparent);
    --danger: #dc2626;
    --success: #16a34a;
    --space: 1rem;
    --container: 1200px;
    --font: Tahoma, "Segoe UI", sans-serif;
    --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; height: auto; display: block; }
a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 1rem; }
.site-main { flex: 1; width: 100%; max-width: var(--container); margin: 0 auto; padding: 2rem 1rem; }

.muted, .text-muted { color: var(--muted); }
.page-title { font-size: clamp(1.35rem, 2.5vw, 1.75rem); margin-bottom: 1rem; font-weight: 700; letter-spacing: -0.02em; }
.empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--muted); }

/* Cards & layout */
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.65rem 1.25rem;
    background: var(--accent);
    color: #fff;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
    font-size: 0.95rem;
    line-height: 1.2;
    transition: background var(--transition), border-color var(--transition), transform var(--transition), opacity var(--transition);
}
.btn:hover { opacity: 0.92; text-decoration: none; color: #fff; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-outline {
    background: transparent;
    border-color: var(--accent);
    color: var(--accent);
}
.btn-outline:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
.btn-ghost {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
}
.btn-sm { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
.btn-block { width: 100%; }

.badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
}
.badge-muted { background: var(--muted); }

/* Forms */
label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: var(--text); }
input[type="text"],
input[type="search"],
input[type="email"],
input[type="tel"],
input[type="password"],
input[type="number"],
input[type="url"],
select,
textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text);
    font: inherit;
    transition: border-color var(--transition), box-shadow var(--transition);
}
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--muted) 50%, var(--border)); }
input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
    outline: none;
}
textarea { min-height: 110px; resize: vertical; }
.form-row { margin-bottom: 1rem; }
.input-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.input-row > input { flex: 1; min-width: 140px; }

/* Header */
.site-header {
    background: var(--primary);
    color: #fff;
    padding: 0.9rem 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 24px rgba(0, 0, 0, 0.12);
}
.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}
.logo {
    color: #fff;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-decoration: none;
}
.logo:hover { color: #fff; text-decoration: none; opacity: 0.92; }
.main-nav {
    display: flex;
    align-items: center;
    gap: 0.35rem 1rem;
    flex-wrap: wrap;
}
.main-nav a {
    color: var(--header-fg);
    font-size: 0.92rem;
    padding: 0.35rem 0.15rem;
    border-radius: 4px;
}
.main-nav a:hover { color: #fff; text-decoration: none; }
.cart-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 0.1rem 0.45rem;
    font-size: 0.72rem;
    font-weight: 700;
    margin-inline-start: 0.25rem;
    min-width: 1.25rem;
    text-align: center;
}
.header-search input {
    width: auto;
    min-width: 140px;
    max-width: 200px;
    padding: 0.4rem 0.7rem;
    border: none;
    border-radius: var(--radius);
    font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.95);
}
.header-search input:focus { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25); }

/* Footer */
.site-footer {
    margin-top: auto;
    padding: 2rem 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--card) 70%, var(--bg));
}
.theme-info { margin-top: 0.5rem; font-size: 0.8rem; }

/* Product cards */
.product-card {
    display: block;
    color: inherit;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    overflow: hidden;
}
.product-card:hover {
    text-decoration: none;
    color: inherit;
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
}
.product-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: calc(var(--radius) - 2px);
    background: var(--bg);
}
.product-card h3 { margin-top: 0.75rem; font-size: 1rem; }
.product-card .price { color: var(--accent); font-weight: 700; margin-top: 0.35rem; }
.money,
.money-slot {
    display: inline-flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 0.2em;
    white-space: nowrap;
    max-width: 100%;
}
.money-slot .money {
    display: inline-flex;
    align-items: center;
    flex-wrap: nowrap;
}
.currency-toman {
    display: inline-block;
    width: 1em;
    height: 1em;
    min-width: 14px;
    min-height: 14px;
    fill: currentColor;
    vertical-align: -0.12em;
    flex-shrink: 0;
}
.currency-code { font-size: 0.85em; opacity: 0.85; flex-shrink: 0; }

/* Product detail */
.product-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
}
.product-price {
    font-size: 1.5rem;
    color: var(--accent);
    font-weight: 700;
    margin: 1rem 0;
}
.product-price s {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 400;
    margin-inline-start: 0.5rem;
}

/* Cart */
.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}
.cart-item-info { display: flex; gap: 1rem; align-items: center; }
.cart-item-img { width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius); }
.cart-item-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.qty-control { display: flex; align-items: center; gap: 0.5rem; }
.qty-control .btn { padding: 0.3rem 0.7rem; }
.qty-value { min-width: 24px; text-align: center; }
.line-total { font-weight: 700; color: var(--accent); }

/* Auth */
.auth-page { max-width: 420px; margin: 0 auto; }
.auth-tabs { display: flex; gap: 0.5rem; padding: 0.5rem; }
.auth-tabs .btn { flex: 1; }

/* Tables */
table.data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
}
table.data-table th,
table.data-table td {
    padding: 0.75rem 1rem;
    text-align: right;
    border-bottom: 1px solid var(--border);
}
table.data-table th {
    background: color-mix(in srgb, var(--bg) 80%, var(--card));
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
}

/* Dashboard tiles */
.grid > a.card {
    color: inherit;
    transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.grid > a.card:hover {
    text-decoration: none;
    color: inherit;
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
    box-shadow: var(--shadow-lg);
}

@media (max-width: 768px) {
    .product-layout { grid-template-columns: 1fr; }
    .site-main { padding: 1.25rem 1rem; }
    .header-search input { min-width: 110px; max-width: 140px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* Rich content + shortcodes */
.rich-content, .page-content {
    line-height: 1.85;
}
.rich-content img, .page-content img, .sc-image {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
}
.sc-grid {
    display: grid;
    gap: 1rem;
    margin: 1rem 0;
}
.sc-grid-1-2,
.sc-grid-1-3 {
    grid-template-columns: 1fr;
}
@media (min-width: 768px) {
    .sc-grid-1-2 { grid-template-columns: 1fr 1fr; }
    .sc-grid-1-3 { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
