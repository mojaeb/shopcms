{% if cms_slider and cms_slider.slides %}
<section class="cms-slider card" style="padding:0; overflow:hidden;">
    <div class="slider-track">
        {% for slide in cms_slider.slides %}
        <a href="{{ slide.link|default:'#' }}" class="slide">
            <img src="{{ slide.image }}" alt="{{ slide.title }}">
            {% if slide.title %}
            <div class="slide-caption">
                <h2>{{ slide.title }}</h2>
                {% if slide.subtitle %}<p>{{ slide.subtitle }}</p>{% endif %}
            </div>
            {% endif %}
        </a>
        {% endfor %}
    </div>
</section>
<style>
.cms-slider { margin-bottom: 1.5rem; }
.slider-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
.slide { flex: 0 0 100%; position: relative; scroll-snap-align: start; }
.slide img { width: 100%; height: 320px; object-fit: cover; display: block; }
.slide-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: #fff; }
</style>
{% endif %}
