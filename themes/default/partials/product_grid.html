{% if products %}
<div class="grid">
    {% for p in products %}
    <a href="/product/{{ p.slug }}/" class="card product-card">
        {% if p.image %}<img src="{{ p.image }}" alt="{{ p.name }}">{% endif %}
        <h3>{{ p.name }}</h3>
        <p class="price">{% money p.base_price %}</p>
        {% if not p.in_stock %}<span class="badge badge-muted">ناموجود</span>{% endif %}
    </a>
    {% endfor %}
</div>
{% else %}
<div class="empty-state card">محصولی یافت نشد.</div>
{% endif %}
