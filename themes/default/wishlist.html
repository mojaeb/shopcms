{% extends "base.html" %}
{% block title %}{{ store.name }} - علاقه‌مندی‌ها{% endblock %}
{% block extra_css %}
<style>
.wishlist-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:1rem; }
.wishlist-card img { width:100%; height:180px; object-fit:cover; border-radius:var(--radius); }
.wishlist-actions { display:flex; gap:0.5rem; margin-top:0.75rem; flex-wrap:wrap; }
</style>
{% endblock %}
{% block content %}
<div id="wishlist-page" data-currency="{{ store.currency }}">
    <h1 class="page-title">لیست علاقه‌مندی‌ها</h1>
    <div id="wishlist-container">
        <div class="empty-state card">در حال بارگذاری...</div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/wishlist.js"></script>
{% endblock %}
