{% extends "base.html" %}
{% block title %}{{ store.name }} - وبلاگ{% endblock %}
{% block extra_css %}
<style>
.blog-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:1rem; }
.blog-card img { width:100%; height:180px; object-fit:cover; border-radius:var(--radius); }
.blog-filters { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
</style>
{% endblock %}
{% block content %}
<div id="blog-list-page">
    <h1 class="page-title">وبلاگ</h1>
    <div class="blog-filters" id="blog-categories"></div>
    <div id="blog-posts">
        <div class="empty-state card">در حال بارگذاری...</div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/blog.js"></script>
{% endblock %}
