:root {
    /* Lona Center — teal trust retail */
    --color-primary: #0f766e;
    --color-on-primary: #ffffff;
    --color-secondary: #0d9488;
    --color-accent: #0f766e;
    --color-background: #f8fafc;
    --color-foreground: #0f172a;
    --color-muted: #f1f5f9;
    --color-border: #e2e8f0;
    --color-destructive: #dc2626;
    --color-ring: #0f766e;

    --primary: #0f766e;
    --primary-50: #f0fdfa;
    --primary-100: #ccfbf1;
    --primary-200: #99f6e4;
    --primary-300: #5eead4;
    --primary-500: #14b8a6;
    --primary-600: #0f766e;
    --primary-700: #115e59;
    --accent: #0f766e;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 0.75rem;      /* 12px */
    --radius-xl: 1rem;      /* 16px */
    --radius-2xl: 1.25rem;  /* 20px */
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.1);
    --danger: #dc2626;
    --success: #0f766e;
    --font: "IranYekan", "Yekan", Tahoma, sans-serif;
    --container: 1280px;
    --header-h: 6.75rem;
    --space-xs: 0.25rem;   /* 4px */
    --space-sm: 0.5rem;    /* 8px */
    --space-md: 1rem;      /* 16px */
    --space-lg: 1.5rem;    /* 24px */
    --space-xl: 2rem;      /* 32px */
    --space-2xl: 3rem;     /* 48px */
    --motion: 220ms;
    --motion-fast: 150ms;
    --motion-slow: 280ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --section-gap: clamp(2.5rem, 6vw, 4.5rem);
}

@media (min-width: 1024px) {
    :root { --header-h: 8.25rem; }
}

html {
    scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
}

body.theme-nextshop {
    font-family: var(--font);
    background:
        radial-gradient(1200px 480px at 100% -10%, color-mix(in srgb, var(--primary-200) 35%, transparent), transparent 55%),
        radial-gradient(900px 420px at -10% 20%, color-mix(in srgb, var(--primary-100) 45%, transparent), transparent 50%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.65;
    font-feature-settings: "ss01";
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
    min-height: 100dvh;
}

body.theme-nextshop .site-main.ns-main {
    max-width: none;
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: clip;
}

body.theme-nextshop a { color: inherit; text-decoration: none; }
body.theme-nextshop a:hover { text-decoration: none; color: var(--primary-600); }

/* UI UX Pro Max — interaction baseline */
body.theme-nextshop a,
body.theme-nextshop button,
body.theme-nextshop [role="button"],
body.theme-nextshop input[type="submit"],
body.theme-nextshop input[type="button"],
body.theme-nextshop .ns-btn,
body.theme-nextshop .ns-icon-btn,
body.theme-nextshop .ns-card,
body.theme-nextshop .ns-banner,
body.theme-nextshop .ns-cat-chip,
body.theme-nextshop .ns-cat-tile,
body.theme-nextshop .ns-cat-pill,
body.theme-nextshop .ns-blog-card,
body.theme-nextshop .ns-blog-filter,
body.theme-nextshop .ns-account-tile,
body.theme-nextshop .ns-nav-item,
body.theme-nextshop .ns-login-btn,
body.theme-nextshop .ns-filter-chip {
    cursor: pointer;
}

body.theme-nextshop a:focus-visible,
body.theme-nextshop button:focus-visible,
body.theme-nextshop input:focus-visible,
body.theme-nextshop select:focus-visible,
body.theme-nextshop textarea:focus-visible,
body.theme-nextshop .ns-btn:focus-visible,
body.theme-nextshop .ns-icon-btn:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    body.theme-nextshop *,
    body.theme-nextshop *::before,
    body.theme-nextshop *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

[x-cloak] { display: none !important; }

.ns-width {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 var(--space-md);
    min-width: 0;
    box-sizing: border-box;
}
@media (min-width: 640px) { .ns-width { padding: 0 var(--space-lg); } }
@media (min-width: 768px) { .ns-width { padding: 0 var(--space-xl); } }

.ns-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    min-height: 2.75rem;
    padding: 0.625rem 1.25rem;
    border-radius: var(--radius);
    background: var(--primary-600);
    color: #fff !important;
    border: none;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.25;
    cursor: pointer;
    transition:
        background var(--motion) var(--ease),
        box-shadow var(--motion) var(--ease),
        transform var(--motion-fast) var(--ease);
}
.ns-btn:hover {
    background: var(--primary-700);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}
.ns-btn:active { background: var(--primary-700); transform: translateY(0); }
.ns-btn--ghost {
    background: #fff;
    color: var(--primary-700) !important;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}
.ns-btn--ghost:hover { background: var(--primary-50); border-color: var(--primary-200); }
.ns-btn--white {
    background: #fff;
    color: var(--primary-700) !important;
    box-shadow: var(--shadow-md);
    transition:
        background var(--motion) var(--ease),
        box-shadow var(--motion) var(--ease),
        transform var(--motion-fast) var(--ease),
        color var(--motion) var(--ease);
}
.ns-btn--white:hover {
    background: #f8fafc;
    color: var(--primary-600) !important;
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
}
.ns-btn--white i {
    transition: transform var(--motion-fast) var(--ease);
}
.ns-btn--white:hover i {
    transform: translateX(-2px);
}
.ns-btn.is-disabled, .ns-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.ns-input, .ns-select {
    width: 100%;
    min-height: 2.75rem;
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    font: inherit;
    font-size: 0.875rem;
    line-height: 1.4;
    color: var(--text);
    transition: border-color var(--motion) var(--ease), box-shadow var(--motion) var(--ease);
}
textarea.ns-input {
    min-height: 6rem;
    resize: vertical;
    line-height: 1.6;
}
.ns-input:focus, .ns-select:focus {
    outline: none;
    border-color: var(--primary-500);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-500) 22%, transparent);
}

.ns-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    min-width: 2.75rem;
    min-height: 2.75rem;
    border-radius: var(--radius);
    border: none;
    background: transparent;
    color: #334155;
    cursor: pointer;
    position: relative;
    transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease), transform var(--motion-fast) var(--ease);
}
.ns-icon-btn:active { transform: scale(0.96); }
.ns-icon-btn:hover {
    background: #f1f5f9;
    color: var(--primary-700);
}
.ns-icon-btn i,
.ns-icon-btn svg {
    width: 1.2rem;
    height: 1.2rem;
}

/* ——— Header ——— */
.ns-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
    border-bottom: 1px solid transparent;
}
.ns-header-bar {
    border-bottom: 1px solid var(--border);
    background: transparent;
}
.ns-header-inner {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    min-height: 3.75rem;
    padding-top: var(--space-sm);
    padding-bottom: var(--space-sm);
}
@media (min-width: 768px) {
    .ns-header-inner {
        min-height: 4.5rem;
        gap: var(--space-lg);
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
    }
}
.ns-header-start {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    min-width: 0;
    flex: 1;
}
@media (min-width: 1024px) {
    .ns-header-start { flex: 0 1 18rem; }
}
.ns-brand-link {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    min-width: 0;
    color: inherit !important;
    transition: opacity var(--motion-fast) var(--ease);
}
.ns-brand-link:hover { color: inherit !important; opacity: 0.92; }
.ns-brand-logo {
    width: 2.75rem;
    height: 2.75rem;
    object-fit: contain;
    flex-shrink: 0;
}
@media (min-width: 768px) {
    .ns-brand-logo { width: 4.5rem; height: 3.25rem; }
}
.ns-brand-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
    line-height: 1.25;
}
.ns-brand-name {
    font-weight: 800;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.02em;
    color: var(--text);
}
@media (min-width: 768px) { .ns-brand-name { font-size: 1.125rem; } }
.ns-brand-sub {
    display: none;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.125rem;
    line-height: 1.3;
}
@media (min-width: 768px) { .ns-brand-sub { display: block; } }

.ns-menu-toggle { display: inline-flex; color: #475569; }
@media (min-width: 768px) { .ns-menu-toggle { display: none; } }

.ns-search {
    align-items: center;
    background: #f1f5f9;
    border-radius: var(--radius);
    padding: 0.125rem;
    color: #64748b;
    border: 1px solid transparent;
    transition:
        border-color var(--motion-fast) var(--ease),
        background var(--motion-fast) var(--ease),
        box-shadow var(--motion-fast) var(--ease);
}
.ns-search:focus-within {
    background: #fff;
    border-color: var(--primary-200);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-500) 14%, transparent);
}
.ns-search--desktop {
    display: none;
    flex: 1;
    max-width: 42rem;
}
@media (min-width: 1024px) { .ns-search--desktop { display: flex; } }
.ns-search--mobile {
    display: flex;
    margin: 0 auto var(--space-sm);
}
@media (min-width: 1024px) { .ns-search--mobile { display: none; } }
.ns-search-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border: none;
    background: transparent;
    color: var(--primary-600);
    flex-shrink: 0;
    border-radius: calc(var(--radius) - 2px);
    pointer-events: none;
}
.ns-search-icon:hover {
    color: var(--primary-700);
}
.ns-search-icon i,
.ns-search-icon svg {
    width: 1.2rem;
    height: 1.2rem;
    stroke-width: 2.25;
}
.ns-search-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    min-height: 2.35rem;
    padding: 0.35rem 0.9rem;
    margin: 0.2rem;
    border: none;
    border-radius: calc(var(--radius) - 2px);
    background: var(--primary-600);
    color: #fff;
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: background var(--motion-fast) var(--ease), transform var(--motion-fast) var(--ease);
}
.ns-search-submit:hover { background: var(--primary-700); }
.ns-search-submit:active { transform: translateY(1px); }
.ns-search-submit i,
.ns-search-submit svg { width: 1rem; height: 1rem; }
@media (max-width: 1023px) {
    .ns-search--desktop .ns-search-submit { display: none; }
    .ns-search--mobile .ns-search-submit {
        width: 2.5rem;
        min-height: 2.5rem;
        padding: 0;
        border-radius: calc(var(--radius) - 2px);
    }
}
.ns-search input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 0.5rem 0.25rem;
    font: inherit;
    font-size: 0.875rem;
    color: var(--text);
    min-width: 0;
}
.ns-search input:focus,
.ns-search input:focus-visible {
    outline: none;
    box-shadow: none;
}
.ns-search input::placeholder { color: #94a3b8; }

.ns-filter-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    margin-inline: 0.125rem;
    padding: 0.375rem 0.75rem;
    min-height: 2.25rem;
    border-radius: calc(var(--radius) - 2px);
    background: #fff;
    border: 1px solid var(--border);
    color: #475569 !important;
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1.2;
    white-space: nowrap;
    flex-shrink: 0;
    transition:
        background var(--motion-fast) var(--ease),
        color var(--motion-fast) var(--ease),
        border-color var(--motion-fast) var(--ease);
}
.ns-search .ns-filter-chip {
    background: var(--primary-50);
    border-color: var(--primary-100);
    color: var(--primary-700) !important;
}
.ns-filter-chip i,
.ns-filter-chip svg { width: 0.875rem; height: 0.875rem; }
.ns-filter-chip:hover {
    background: var(--primary-50);
    border-color: var(--primary-200);
    color: var(--primary-700) !important;
}
.ns-filter-chip--tablet { display: none; }
@media (min-width: 768px) and (max-width: 1023px) {
    .ns-filter-chip--tablet { display: inline-flex; }
}

.ns-header-end {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-sm);
    flex-shrink: 0;
}
.ns-header-icons {
    display: none;
    align-items: center;
    gap: 0.125rem;
    padding-inline-start: var(--space-sm);
    border-inline-start: 1px solid var(--border);
}
@media (min-width: 640px) { .ns-header-icons { display: flex; } }
.ns-cart-link { position: relative; }
.ns-cart-chip, .ns-cart-fab-count {
    position: absolute;
    top: 0.125rem;
    inset-inline-end: 0.125rem;
    background: var(--primary-600);
    color: #fff;
    font-size: 0.625rem;
    font-weight: 700;
    min-width: 1.05rem;
    height: 1.05rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    padding: 0 0.2rem;
    line-height: 1;
}
.ns-header-auth { display: flex; align-items: center; gap: 0.35rem; }
.ns-login-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    min-height: 2.5rem;
    padding: 0.5rem 0.875rem;
    border-radius: var(--radius);
    background: var(--primary-600);
    color: #fff !important;
    font-size: 0.8125rem;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: var(--shadow);
    transition: background var(--motion) var(--ease), box-shadow var(--motion) var(--ease), transform var(--motion-fast) var(--ease);
}
.ns-login-btn i,
.ns-login-btn svg { width: 1rem; height: 1rem; }
.ns-login-btn span { display: none; }
@media (min-width: 480px) { .ns-login-btn span { display: inline; } }
@media (min-width: 768px) {
    .ns-login-btn { font-size: 0.875rem; padding: 0.5rem 1rem; }
}
.ns-login-btn:hover {
    background: var(--primary-700);
    color: #fff !important;
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}

.ns-user-chip {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    background: #f1f5f9;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 0.25rem 0.375rem 0.25rem 0.625rem;
    max-width: 13.5rem;
    color: inherit !important;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
}
.ns-user-chip:hover {
    background: #fff;
    border-color: var(--border);
    color: inherit !important;
}
.ns-logout-btn {
    display: inline-grid;
    place-items: center;
    width: 2.35rem;
    height: 2.35rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted) !important;
    flex-shrink: 0;
    transition:
        background var(--motion-fast) var(--ease),
        border-color var(--motion-fast) var(--ease),
        color var(--motion-fast) var(--ease);
}
.ns-logout-btn i,
.ns-logout-btn svg { width: 1.05rem; height: 1.05rem; }
.ns-logout-btn:hover {
    background: #fef2f2;
    border-color: #fecaca;
    color: #b91c1c !important;
}
.ns-logout-btn:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.ns-user-meta {
    display: none;
    flex-direction: column;
    min-width: 0;
    text-align: right;
}
@media (min-width: 768px) { .ns-user-meta { display: flex; } }
.ns-user-meta strong {
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.ns-user-meta span {
    font-size: 0.6875rem;
    color: var(--muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.ns-user-avatar {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: calc(var(--radius) - 2px);
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    display: grid;
    place-items: center;
    color: #fff;
    flex-shrink: 0;
    font-size: 0.875rem;
    font-weight: 700;
}

.ns-nav-bar {
    display: none;
    background: transparent;
    border-bottom: 1px solid var(--border);
}
@media (min-width: 768px) { .ns-nav-bar { display: block; } }
.ns-nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    min-height: 2.75rem;
}
.ns-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    min-width: 0;
    gap: 0.125rem;
}
.ns-nav-item {
    position: relative;
    display: inline-flex;
    align-items: center;
}
.ns-nav-item > a,
a.ns-nav-item {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: 0.625rem 0.875rem;
    color: #475569 !important;

}

.ns-support-icon {

    height: 2rem;

}

}
.ns-support-icon i,
.ns-support-icon svg { width: 0.9rem; height: 0.9rem; }
.ns-support-text {

.ns-support-label {

.ns-drawer {

.ns-drawer-head {

}

}

}
.ns-drawer-close {

    height: 2.5rem;

.ns-drawer-login {

}
.ns-drawer-login:hover { background: var(--primary-700); color: #fff !important; }
.ns-drawer-login i,
.ns-drawer-login svg { width: 1rem; height: 1rem; }
.ns-drawer-logout {

}
.ns-drawer-logout i,
.ns-drawer-logout svg { width: 1rem; height: 1rem; }
.ns-drawer-nav {
    display: flex;

.ns-drawer-nav > a {

    transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
}
.ns-drawer-nav > a:hover { background: var(--primary-50); color: var(--primary-700) !important; }

.ns-drawer-children {

/* ——— Mobile cart FAB ——— */
.ns-cart-fab {
    display: flex;

    bottom: 1.25rem;
    z-index: 90;
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 999px;
    background: var(--primary-600);
    color: #fff !important;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
    transition: background var(--motion) var(--ease), transform var(--motion-fast) var(--ease);
}
.ns-cart-fab:hover {
    background: var(--primary-700);
    color: #fff !important;
    transform: translateY(-2px);
}
@media (min-width: 640px) { .ns-cart-fab { display: none; } }

/* ——— Home ——— */
.ns-home { padding-bottom: 0; overflow-x: clip; }
.ns-hero-band {

        radial-gradient(ellipse at 80% 0%, color-mix(in srgb, var(--primary-200) 55%, transparent), transparent 55%),

}
.ns-hero-grid {

.ns-slider {

        height: 100%;

        max-height: none;
        aspect-ratio: auto;
        align-self: stretch;
    }
    .ns-slider.swiper { height: 100%; }
}
.ns-slider .swiper-wrapper { height: 100%; }
.ns-slider-slide {
    position: relative;
    height: 100%;
    overflow: hidden;
}
.ns-slider-slide img,
.ns-slider-fallback {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.ns-slider-fallback {
    background: linear-gradient(135deg, var(--primary-600), var(--primary-500) 55%, var(--primary-600));
}
.ns-slider-link {

    width: 100%;
    height: 100%;

}
.ns-slider-caption {
    position: absolute;

}
.ns-slider-caption strong {

}
.ns-slider-caption > span {
    display: block;
    margin-top: var(--space-sm);
    font-size: 0.875rem;
    opacity: .88;
    max-width: 26rem;
    line-height: 1.65;
}
.ns-slider-cta {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    margin-top: var(--space-md);
    padding: 0.5rem 1rem;
    min-height: 2.5rem;
    border-radius: var(--radius);
    background: #fff;
    color: var(--primary-600) !important;

}
.ns-slider-cta:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}
.ns-slider-cta i { width: 1rem; height: 1rem; }
.ns-slider-nav {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-sm);
    pointer-events: none;
    z-index: 3;
}
.ns-slider-nav button {
    pointer-events: auto;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,.94);
    color: #334155;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-md);
    transition: transform var(--motion-fast) var(--ease), background var(--motion-fast) var(--ease), box-shadow var(--motion) var(--ease);
}
.ns-slider-nav button:hover { background: #fff; transform: scale(1.04); box-shadow: var(--shadow-lg); }
.ns-slider-nav button.swiper-button-disabled {
    opacity: 0.35;

    transform: none;
}
.ns-slider-nav button i { width: 1.1rem; height: 1.1rem; }
.ns-slider-dots {
    position: absolute;
    inset-inline: 0;
    bottom: var(--space-md);
    left: 0;
    right: 0;
    width: 100% !important;
    transform: none !important;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--space-sm);
    z-index: 4;
    margin: 0;
    padding: 0;
    pointer-events: none;
}
.ns-slider-dots .swiper-pagination-bullet {
    width: 0.5rem;
    height: 0.5rem;
    margin: 0 !important;
    border-radius: 999px;

.ns-banners {
    display: grid;

    gap: var(--space-sm);

}

    .ns-banners { gap: var(--space-md); }
}
@media (min-width: 1024px) {
    .ns-banners {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
        height: 100%;
        gap: var(--space-lg);
        min-height: 0;
    }
}
.ns-banner {
    flex: 1;
    border-radius: var(--radius-xl);
    position: relative;
    overflow: hidden;
    min-height: 6.5rem;
    background-size: cover;
    background-position: center;
    transition: transform var(--motion) var(--ease), box-shadow var(--motion) var(--ease);
}
@media (min-width: 640px) {
    .ns-banner {

        min-height: 7.5rem;
    }

.ns-banner:hover {

.ns-banner-inner {

.ns-banner-inner p {

}

.ns-banner-cta {

.ns-banner-cta .ns-btn {

.ns-banner-cta .ns-btn i { width: 0.95rem; height: 0.95rem; }

}

.ns-cat-strip {

    padding-inline-end: 0.875rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: #334155 !important;
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1.25;
    transition:
        border-color var(--motion-fast) var(--ease),

        background var(--motion-fast) var(--ease);

.ns-cat-chip:hover {

.ns-cat-chip img,
.ns-cat-chip-fallback {

.ns-discount-strip {

    overflow-x: clip;

    .ns-discount-strip { padding: var(--space-2xl) 0; }
}
.ns-discount-inner {

    gap: var(--space-lg);
    min-width: 0;
    max-width: 100%;
}
@media (min-width: 768px) {
    .ns-discount-inner {
        display: grid;
        grid-template-columns: minmax(0, 14rem) minmax(0, 1fr);
        gap: var(--space-lg);
        align-items: stretch;
    }

    .ns-discount-inner { grid-template-columns: minmax(0, 16rem) minmax(0, 1fr); gap: var(--space-xl); }
}
.ns-discount-copy {

.ns-discount-kicker {

.ns-section {

}
.ns-section-link {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    color: var(--primary-600) !important;
    font-size: 0.875rem;
    font-weight: 600;
    white-space: nowrap;
    transition: color var(--motion-fast) var(--ease), gap var(--motion-fast) var(--ease);
}
.ns-section-link:hover {
    color: var(--primary-700) !important;
    gap: var(--space-sm);
}
.ns-section-link i { width: 1rem; height: 1rem; }
.ns-section-more {
    display: flex;
    justify-content: center;
    padding: var(--space-md) 0 0;
}
.ns-section-more .ns-btn { font-size: 0.875rem; }

.ns-carousel {
    position: relative;
    min-width: 0;
    max-width: 100%;
    width: 100%;
}
.ns-carousel .swiper {
    width: 100%;
    overflow: hidden;
    padding: var(--space-xs) 0 var(--space-sm);
}
.ns-carousel .swiper-wrapper {
    align-items: stretch;
}
.ns-carousel .swiper-slide {
    width: 11.5rem;
    max-width: 80vw;
    height: auto;
    box-sizing: border-box;
}
.ns-carousel .swiper-slide > .ns-card {
    width: 100%;
    height: 100%;
}
@media (min-width: 640px) {
    .ns-carousel .swiper-slide {
        width: 14.5rem;
        max-width: none;
    }
}
.ns-carousel-empty {
    flex: 1 0 100%;
    width: 100% !important;
    max-width: none !important;
    padding: var(--space-xl) var(--space-md);
    text-align: center;
    color: var(--muted);
    font-size: 0.9375rem;
    background: #fff;
    border: 1px dashed var(--border);
    border-radius: var(--radius-xl);
}
.ns-carousel-nav {
    display: none;
}
@media (min-width: 768px) {
    .ns-carousel-nav {
        display: flex;
        gap: var(--space-sm);
        position: absolute;
        inset-inline-start: 0;
        top: -2.75rem;
        z-index: 2;
    }
}
.ns-carousel--on-blue {
    padding-top: 0;
    min-width: 0;
}
@media (min-width: 768px) {
    .ns-carousel--on-blue {
        padding-top: 2.75rem;
    }
    .ns-carousel--on-blue .ns-carousel-nav {
        top: 0;
        inset-inline-start: 0;
    }
}
.ns-carousel-btn {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.18);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), opacity var(--motion-fast) var(--ease);
}
.ns-carousel-btn:hover { background: rgba(255,255,255,.32); border-color: rgba(255,255,255,.5); }
.ns-carousel-btn.swiper-button-disabled {
    opacity: 0.35;
    cursor: default;
}
.ns-carousel-btn i { width: 1.05rem; height: 1.05rem; }
.ns-carousel:not(.ns-carousel--on-blue) .ns-carousel-btn {
    border-color: var(--border);
    background: #fff;
    color: #334155;
    box-shadow: var(--shadow);
}
.ns-carousel:not(.ns-carousel--on-blue) .ns-carousel-btn:hover {
    border-color: var(--primary-200);
    color: var(--primary-700);
    box-shadow: var(--shadow-md);
}

.ns-mid-banners { padding: var(--space-xl) 0; }
.ns-mid-banners-grid {
    display: grid;
    gap: var(--space-md);
    grid-template-columns: 1fr;
}
@media (min-width: 768px) {
    .ns-mid-banners-grid { grid-template-columns: 1.35fr 1fr; gap: var(--space-lg); }
}

.ns-trust {
    margin-top: 0;
    padding: var(--space-xl) 0 var(--space-2xl);
    background: #fff;
    border-top: 1px solid var(--border);
}
.ns-trust-grid {
    display: grid;
    gap: var(--space-md);
    grid-template-columns: 1fr 1fr;
}
@media (min-width: 900px) {
    .ns-trust-grid { grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
}
.ns-trust-item {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    background: var(--bg);
    transition: border-color var(--motion) var(--ease), box-shadow var(--motion) var(--ease);
}
.ns-trust-item:hover {
    border-color: var(--primary-200);
    box-shadow: var(--shadow);
}
.ns-trust-icon {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    background: var(--primary-50);
    color: var(--primary-600);
    flex-shrink: 0;
}
.ns-trust-icon i { width: 1.125rem; height: 1.125rem; }
.ns-trust-item strong {
    display: block;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
}
.ns-trust-item p {
    margin-top: var(--space-xs);
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.45;
}

/* ——— Product card ——— */
.ns-card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: var(--space-sm);
    box-shadow: var(--shadow);
    transition:
        box-shadow var(--motion) var(--ease),
        transform var(--motion) var(--ease),
        border-color var(--motion) var(--ease);
    position: relative;
    overflow: hidden;
    height: 100%;
    color: inherit !important;
}
.ns-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
    border-color: var(--primary-200);
    color: inherit !important;
}
.ns-card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 11rem;
    border-radius: calc(var(--radius-xl) - 2px);
    overflow: hidden;
    background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    flex-shrink: 0;
}
.ns-card-media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: var(--space-sm);
    transition: transform var(--motion-slow) var(--ease);
}
.ns-card:hover .ns-card-media img { transform: scale(1.03); }
.ns-card-placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    color: #94a3b8;
    background: linear-gradient(135deg, #f8fafc, #f1f5f9);
}
.ns-card-placeholder i { width: 1.75rem; height: 1.75rem; }

/* ——— Badges ——— */
.ns-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    min-height: 1.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    white-space: nowrap;
    vertical-align: middle;
    box-shadow: var(--shadow);
    transition: transform var(--motion-fast) var(--ease), box-shadow var(--motion) var(--ease);
}
.ns-badge i,
.ns-badge svg {
    width: 0.75rem;
    height: 0.75rem;
    flex-shrink: 0;
}
.ns-badge--sale {
    background: #dc2626;
    border-color: color-mix(in srgb, #b91c1c 35%, transparent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}
.ns-badge--feat {
    background: var(--primary-600);
    border-color: color-mix(in srgb, var(--primary-700) 30%, transparent);
    color: #fff;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--primary-600) 22%, transparent);
}
.ns-badge--soft {
    background: #f1f5f9;
    border-color: var(--border);
    color: #334155;
    box-shadow: none;
    font-weight: 600;
}
.ns-badge--success {
    background: var(--primary-50);
    border-color: var(--primary-100);
    color: var(--primary-700);
    box-shadow: none;
    font-weight: 600;
}
.ns-badge--muted {
    background: #f8fafc;
    border-color: var(--border);
    color: #64748b;
    box-shadow: none;
    font-weight: 600;
}
.ns-badge--warn {
    background: #fff7ed;
    border-color: #fed7aa;
    color: #c2410c;
    box-shadow: none;
    font-weight: 600;
}

/* Overlay badge on product media */
.ns-card-badge {
    position: absolute;
    top: var(--space-sm);
    inset-inline-end: var(--space-sm);
    z-index: 2;
    pointer-events: none;
}
.ns-card:hover .ns-card-badge {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}
.ns-card:hover .ns-badge--sale {
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.28);
}
.ns-card:hover .ns-badge--feat {
    box-shadow: 0 4px 12px color-mix(in srgb, var(--primary-600) 28%, transparent);
}

/* Back-compat aliases */
.ns-card-badge:not(.ns-badge) {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    background: #dc2626;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.2;
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}
.ns-card-badge--feat:not(.ns-badge) {
    background: var(--primary-600);
    box-shadow: 0 2px 8px color-mix(in srgb, var(--primary-600) 22%, transparent);
}
.ns-discount-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    background: #dc2626;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.2;
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
}

.ns-card-body {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    padding: var(--space-md) var(--space-sm) var(--space-sm);
}
.ns-card-cat {
    display: block;
    margin-bottom: var(--space-xs);
    min-height: 1.05em;
    font-size: 0.75rem;
    line-height: 1.35;
    color: var(--muted);
}
.ns-card-title {
    font-size: 0.875rem;
    color: var(--text);
    line-height: 1.45;
    font-weight: 600;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: calc(1.45em * 2);
}
@media (min-width: 640px) { .ns-card-title { font-size: 0.9375rem; } }
.ns-card-meta {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    gap: var(--space-sm);
    padding-top: var(--space-md);
}
.ns-price {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--space-xs);
    min-height: 2.5rem;
}
.ns-price s,
.ns-price-was {
    display: block;
    min-height: 1.05em;
    color: #94a3b8;
    font-size: 0.75rem;
    line-height: 1.25;
}
.ns-price-was--empty { visibility: hidden; }
.ns-price strong {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.25;
}
@media (min-width: 640px) { .ns-price strong { font-size: 1.0625rem; } }
.ns-card-oos {
    position: absolute;
    inset: 0;
    background: rgba(248,250,252,.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
    text-align: center;
    backdrop-filter: blur(1px);
}
.ns-card-oos span {
    background: #fff;
    box-shadow: var(--shadow-md);
    border-radius: var(--radius);
    padding: 0.625rem var(--space-md);
    color: #475569;
    font-size: 0.875rem;
    font-weight: 600;
}

.ns-products-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-md);
}
@media (min-width: 640px) {
    .ns-products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-md); }
}
@media (min-width: 1024px) {
    .ns-products-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-lg); }
}

/* ——— Shared page shell (8px SaaS system) ——— */
.ns-page {
    padding: var(--space-xl) 0 var(--space-2xl);
}
.ns-page-head {
    margin-bottom: var(--space-lg);
}
.ns-page-title {
    font-size: clamp(1.5rem, 2.4vw, 1.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--text);
}
.ns-page-sub {
    margin-top: var(--space-sm);
    max-width: 40rem;
    font-size: 0.9375rem;
    line-height: 1.65;
    color: #475569;
}
body.theme-nextshop .muted {
    color: #475569;
}
body.theme-nextshop .ns-page .card,
body.theme-nextshop #cart-page .card,
body.theme-nextshop #cart-summary .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
body.theme-nextshop .ns-page .btn,

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 40px;
    padding: 8px 16px;
    border-radius: 12px;
    background: var(--primary-600);
    color: #fff !important;
    border: 1px solid transparent;

body.theme-nextshop .ns-page .btn:hover,
body.theme-nextshop #cart-page .btn:hover {

}
body.theme-nextshop .ns-page .btn:focus-visible,
body.theme-nextshop #cart-page .btn:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
body.theme-nextshop .ns-page .btn-outline,
body.theme-nextshop #cart-page .btn-outline {
    background: #fff;
    color: var(--primary-700) !important;
    border-color: #e2e8f0;
}
body.theme-nextshop .ns-page .btn-outline:hover,
body.theme-nextshop #cart-page .btn-outline:hover {
    background: var(--primary-50);
    border-color: var(--primary-200);
}
body.theme-nextshop .ns-page .empty-state,
body.theme-nextshop #cart-page .empty-state {
    text-align: center;
    padding: 48px 24px;

/* Cart items (JS-rendered) */
#cart-page .cart-item,
#cart-container .cart-item {

#cart-summary {

#cart-summary .card p {

.ns-coupon {

.ns-checkout .ns-page-title {

.ns-checkout-trust,

.ns-checkout-grid {

.ns-checkout-main {

.ns-checkout-panel,

.ns-checkout-step-icon {

    width: 32px;
    height: 32px;

    background: var(--primary-50);
    color: var(--primary-700);

}
.ns-checkout-step-icon i {
    width: 16px;
    height: 16px;
    color: inherit;
}
.ns-checkout-panel h2 i,
.ns-checkout-summary-card h2 i {
    width: 16px;
    height: 16px;
    color: inherit;

.ns-checkout-manage {

.ns-checkout-items {
    display: flex;
    flex-direction: column;

.ns-checkout-items .checkout-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #f1f5f9;

.ns-checkout-items .checkout-item-info {

}
.ns-checkout-items .checkout-item-img {

    height: 64px;

}
.ns-checkout-items .checkout-item-img--empty { background: #e2e8f0; }
.ns-checkout-items .checkout-item-title {

    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    min-height: 1.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #f1f5f9;
    color: #334155;
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.2;
}
.ns-account .status-badge,
.ns-account .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    min-height: 1.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: 999px;
    border: 1px solid var(--primary-100);
    background: var(--primary-50);
    color: var(--primary-700);
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.2;
    box-shadow: none;
}
.ns-account .status-badge.success,
.ns-account .badge.success {
    background: #ecfdf5;
    border-color: #a7f3d0;
    color: #047857;
}
.ns-account .status-badge.muted,
.ns-account .badge.muted {
    background: #f8fafc;
    border-color: var(--border);
    color: #64748b;
}
.ns-empty {
    text-align: center;
    padding: var(--space-2xl) var(--space-lg);
    color: #475569;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    font-size: 0.9375rem;
    line-height: 1.6;
    box-shadow: var(--shadow);
}
.ns-empty-icon {
    display: grid;
    place-items: center;
    width: 3.5rem;
    height: 3.5rem;
    margin: 0 auto var(--space-md);
    border-radius: 1rem;
    background: var(--primary-50);
    color: var(--primary-700);
    border: 1px solid var(--primary-100);
}
.ns-empty-icon i,
.ns-empty-icon svg {
    width: 1.5rem;
    height: 1.5rem;
}
.ns-empty strong {
    display: block;
    color: var(--text);
    font-size: 1.0625rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
}
.ns-empty p {
    margin: 0 auto;
    max-width: 28rem;
    color: var(--muted);
}
.ns-empty .ns-btn {
    margin-top: var(--space-lg);
}
.ns-catalog-main .pagination,
#product-pagination .pagination {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    margin-top: var(--space-xl);
    padding-top: var(--space-lg);
}
.ns-catalog-main .pagination button,
#product-pagination .pagination button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    min-height: 2.5rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: #334155;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition:
        background var(--motion-fast) var(--ease),
        border-color var(--motion-fast) var(--ease),
        color var(--motion-fast) var(--ease),
        box-shadow var(--motion-fast) var(--ease);
}
.ns-catalog-main .pagination button:hover,
#product-pagination .pagination button:hover {
    border-color: var(--primary-300);
    color: var(--primary-700);
    box-shadow: var(--shadow);
}
.ns-catalog-main .pagination button.active,
#product-pagination .pagination button.active,
.ns-catalog-main .pagination button[aria-current="page"],
#product-pagination .pagination button[aria-current="page"] {
    background: var(--primary-600);
    border-color: var(--primary-600);
    color: #fff;
    box-shadow: var(--shadow-md);
}
.ns-catalog-main .pagination button:disabled,
#product-pagination .pagination button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
}

/* ——— Cart ——— */
.ns-coupon {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    margin-top: 16px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.ns-coupon-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}
.ns-coupon-row .ns-input { flex: 1; min-width: 10rem; }
.ns-coupon-msg { margin-top: 12px; min-height: 1.25rem; }

/* ——— Footer ——— */
.ns-footer {
    margin-top: 2.5rem;
    background: #e5e7eb;
    padding: 2.5rem 0;
}
.ns-footer-grid {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}
@media (min-width: 640px) {
    .ns-footer-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1.5rem;
    }
}
.ns-footer-map {
    display: none;
    flex-direction: column;
    gap: 0.65rem;
}
@media (min-width: 768px) {
    .ns-footer-map { display: flex; grid-column: span 2; }
}
.ns-footer-about {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
@media (min-width: 640px) {
    .ns-footer-about {
        grid-column: span 6;
        flex-direction: row;
        gap: 1.5rem;
    }
}
.ns-footer-about-copy { flex: 1; line-height: 1.8; font-size: 0.9rem; color: #374151; }
.ns-footer-badges {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    padding: 0.5rem 0;
}
.ns-footer-badges img { width: 5.5rem; height: 5.5rem; object-fit: contain; }
.ns-footer-contact {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}
@media (min-width: 640px) {
    .ns-footer-contact { grid-column: span 4; }
}
@media (min-width: 768px) {
    .ns-footer-contact { grid-column: span 4; }
}
.ns-footer h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
}
.ns-footer-links {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    color: #4b5563;
    font-size: 0.9rem;
}
.ns-footer-links--row {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 0.75rem;
}
.ns-footer-box {
    background: #f1f5f9;
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    font-size: 0.85rem;
    color: #475569;
}
.ns-footer-phones {
    display: grid;
    gap: 0.4rem;
}
@media (min-width: 640px) {
    .ns-footer-phones { grid-template-columns: 1fr 1fr; }
}
.ns-footer-ig {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-600);
    color: #fff !important;
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    font-size: 0.85rem;
    font-weight: 600;
}
.ns-footer-ig:hover { background: var(--primary-700); color: #fff !important; }
.ns-footer-bottom {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid #d1d5db;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #6b7280;
}
.ns-footer-powered {
    opacity: 0.7;
}

/* ——— Account / dashboard ——— */
.ns-account {
    display: grid;
    gap: 16px;
    padding: 24px 0 48px;
}
@media (min-width: 900px) {
    .ns-account {
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
    }
}
.ns-account-nav {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 8px;
    display: flex;
    flex-direction: row;
    gap: 4px;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.ns-account-nav::-webkit-scrollbar { display: none; }
@media (min-width: 900px) {
    .ns-account-nav {
        flex-direction: column;
        position: sticky;
        top: calc(var(--header-h) + 16px);
        overflow: visible;
        padding: 12px 8px;
    }
}
.ns-account-nav a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    color: #334155 !important;
    font-size: 0.875rem;
    font-weight: 500;
    white-space: nowrap;
    transition: background .15s, color .15s;
}
.ns-account-nav a:hover {
    background: var(--primary-50);
    color: var(--primary-700) !important;
}
.ns-account-nav a.is-active {
    background: var(--primary-600);
    color: #fff !important;
}
.ns-account-nav a.ns-account-logout {
    color: #b91c1c !important;
}
@media (min-width: 900px) {
    .ns-account-nav a.ns-account-logout {
        margin-top: 4px;
        border-top: 1px solid #e2e8f0;
    }
}
.ns-account-nav a.ns-account-logout:hover {
    background: #fef2f2;
    color: #991b1b !important;
}
.ns-account-nav a.ns-account-logout.is-active {
    background: #fef2f2;
    color: #991b1b !important;
}
.ns-account-nav a:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.ns-account-nav a i { width: 18px; height: 18px; flex-shrink: 0; }
.ns-account-nav-user {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-top: 1px solid #e2e8f0;
    gap: 12px;
    align-items: center;
}
@media (min-width: 900px) {
    .ns-account-nav-user { display: flex; }
}
.ns-account-nav-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
    color: #fff;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    font-weight: 700;
}
.ns-account-nav-user strong {
    display: block;
    font-size: 0.875rem;
    color: #0f172a;
}
.ns-account-nav-user span {
    font-size: 0.75rem;
    color: #475569;
}

.ns-account-main { min-width: 0; }
.ns-account-hero {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.ns-account-hero::before {
    content: "";
    position: absolute;
    inset: 0 auto auto 0;
    width: 144px;
    height: 144px;
    background: radial-gradient(circle, var(--primary-100), transparent 70%);
    transform: translate(30%, -40%);
    pointer-events: none;
}
.ns-account-hero h1 {
    font-size: clamp(1.35rem, 2.4vw, 1.75rem);
    font-weight: 700;
    margin-bottom: 8px;
    position: relative;
    color: #0f172a;
    line-height: 1.25;
}
.ns-account-hero p {
    color: #475569;
    font-size: 0.9375rem;
    line-height: 1.55;
    position: relative;
}
.ns-account-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    position: relative;
}
.ns-account-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #1e293b;
    font-size: 0.8125rem;
    font-weight: 600;
}

.ns-account-staff {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 20px;
    margin-bottom: 16px;
    border-radius: 16px;
    background: linear-gradient(120deg, var(--primary-700), var(--primary-600));
    color: #fff !important;
}
.ns-account-staff:hover { color: #fff !important; opacity: .96; }
.ns-account-staff strong { display: block; margin-bottom: 4px; font-size: 1rem; }
.ns-account-staff span { opacity: .9; font-size: 0.875rem; }

.ns-account-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}
.ns-account-tile {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 24px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    color: inherit !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: box-shadow .2s, border-color .2s, transform .2s;
}
.ns-account-tile:hover {
    border-color: var(--primary-200);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    transform: translateY(-2px);
    color: inherit !important;
}
.ns-account-tile-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--primary-50);
    color: var(--primary-700);
    display: grid;
    place-items: center;
    margin-bottom: 4px;
}
.ns-account-tile-icon i { width: 18px; height: 18px; }
.ns-account-tile h2 {
    font-size: 1rem;
    font-weight: 700;
    color: #0f172a;
}
.ns-account-tile p {
    color: #475569;
    font-size: 0.875rem;
    line-height: 1.5;
    flex: 1;
}
.ns-account-tile-link {
    margin-top: 8px;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--primary-700);
}

.ns-profile-grid {
    display: grid;
    gap: 16px;
}
@media (min-width: 640px) {
    .ns-profile-grid { grid-template-columns: 1fr 1fr; }
}
.ns-profile-field {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
}
.ns-profile-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 4px;
}
.ns-profile-field strong {
    font-size: 0.9375rem;
    font-weight: 600;
    color: #0f172a;
    word-break: break-word;
}
.ns-profile-avatar-lg {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
}

/* Polish JS-rendered account widgets */
.ns-account .card,
.ns-account .order-card,
.ns-account .address-card,
.ns-account .wishlist-card,
.ns-account .comment-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    margin-bottom: 16px;
}
.ns-account .page-title {
    font-size: clamp(1.35rem, 2.2vw, 1.55rem);
    font-weight: 700;
    margin-bottom: 16px;
    color: #0f172a;
}
.ns-account .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    padding: 8px 16px;
    border-radius: 12px;
    background: var(--primary-600);
    color: #fff !important;
    border: 1px solid transparent;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
}
.ns-account .btn:hover { background: var(--primary-700); text-decoration: none; }
.ns-account .btn:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.ns-account .btn-outline,
.ns-account .btn.btn-outline {
    background: #fff;
    color: var(--primary-700) !important;
    border-color: #e2e8f0;
}
.ns-account .btn-outline:hover { background: var(--primary-50); border-color: var(--primary-200); }
.ns-account .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: #475569;
    background: #fff;
    border: 1px dashed #e2e8f0;
    border-radius: 16px;
}
.ns-account .wishlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}
.ns-account .wishlist-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
}
.ns-account .wishlist-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}
.ns-account .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
}
.ns-account .form-grid label,
.ns-account #address-form > label {
    font-size: 0.875rem;
    font-weight: 600;
    color: #334155;
}
.ns-account .form-grid input,
.ns-account .form-grid textarea,
.ns-account #address-form textarea,
.ns-account #address-form input {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font: inherit;
    background: #fff;
    color: #0f172a;
}
.ns-account .form-grid input:focus,
.ns-account #address-form textarea:focus,
.ns-account #address-form input:focus {
    outline: 2px solid color-mix(in srgb, var(--primary-600) 35%, transparent);
    border-color: var(--primary-600);
}
.ns-account .order-item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
}
.ns-account .order-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
}
.ns-account .order-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 16px;
}
.ns-account .history-item {
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
}
.ns-account-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
}
.ns-account-toolbar .page-title { margin: 0; }

/* Auth page */
.ns-auth {
    width: min(100% - 24px, 28rem);
    margin: 32px auto 48px;
}
.ns-auth-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
}
.ns-auth-card .page-title {
    text-align: center;
    margin-bottom: 8px;
    font-size: 1.5rem;
    font-weight: 700;
    color: #0f172a;
}
.ns-auth-card > .muted {
    text-align: center;
    margin-bottom: 24px;
    color: #475569;
    font-size: 0.9375rem;
}
.ns-auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 24px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 12px;
}
.ns-auth-tabs .auth-tab {
    border: none;
    background: transparent;
    padding: 12px;
    border-radius: 8px;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    color: #475569;
    width: 100%;
}
.ns-auth-tabs .auth-tab.is-active,
.ns-auth-tabs .auth-tab.btn:not(.btn-outline) {
    background: #fff !important;
    color: var(--primary-700) !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}
.ns-auth-tabs .auth-tab.btn-outline {
    background: transparent !important;
    color: #475569 !important;
    border: none !important;
    box-shadow: none;
}
.ns-auth label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #334155;
}
.ns-auth input {
    width: 100%;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font: inherit;
    margin-bottom: 16px;
    color: #0f172a;
    background: #fff;
}
.ns-auth input:focus {
    outline: 2px solid color-mix(in srgb, var(--primary-600) 35%, transparent);
    border-color: var(--primary-600);
}
.ns-auth .btn {
    display: inline-flex;
    width: 100%;
    justify-content: center;
    align-items: center;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--primary-600);
    color: #fff !important;
    border: none;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 700;
    cursor: pointer;
}
.ns-auth .btn:hover { background: var(--primary-700); }
.ns-auth .btn:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.ns-auth .btn-outline {
    background: #fff;
    color: var(--primary-700) !important;
    border: 1px solid #e2e8f0;
    margin-top: 8px;
}
.ns-auth .btn-outline:hover { background: var(--primary-50); }

/* Blog */
.ns-blog-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
}
.ns-blog-filter {
    display: inline-flex;
    align-items: center;
    min-height: 2.35rem;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #334155;
    font: inherit;
    font-size: 0.86rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.ns-blog-filter:hover {
    border-color: var(--primary-300);
    color: var(--primary-700);
}
.ns-blog-filter.is-active {
    background: var(--primary-600);
    border-color: var(--primary-600);
    color: #fff;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--primary-600) 24%, transparent);
}

.ns-home-blog {
    padding-bottom: var(--space-xl);
}
.ns-blog-grid {
    display: grid;
    gap: var(--space-md);
    grid-template-columns: 1fr;
}
@media (min-width: 640px) {
    .ns-blog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-md); }
}
@media (min-width: 1024px) {
    .ns-blog-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
}

.ns-blog-card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 1rem;
    overflow: hidden;
    color: inherit !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: transform var(--motion) var(--ease), box-shadow var(--motion-slow) var(--ease), border-color var(--motion) var(--ease);
    height: 100%;
}
.ns-blog-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary-200);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--primary-600) 12%, transparent);
    color: inherit !important;
}
.ns-blog-card-media,
.ns-blog-card .ns-blog-card-media {
    display: block;
    aspect-ratio: 16 / 10;
    background: linear-gradient(160deg, var(--primary-50), #f1f5f9);
    overflow: hidden;
}
.ns-blog-card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .35s ease;
}
.ns-blog-card:hover .ns-blog-card-media img { transform: scale(1.04); }
.ns-blog-card-media--empty { min-height: 10rem; }
.ns-blog-card-body {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    padding: 1rem 1rem 1.1rem;
    flex: 1;
}
.ns-blog-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.75rem;
    font-size: 0.75rem;
    color: #64748b;
}
.ns-blog-card-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.45;
    color: #0f172a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
}
.ns-blog-card-excerpt {
    margin: 0;
    font-size: 0.86rem;
    line-height: 1.6;
    color: #64748b;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.ns-blog-card-more {
    margin-top: auto;
    padding-top: 0.55rem;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--primary-700);
}
.ns-blog-card-more i { width: 0.95rem; height: 0.95rem; }

.ns-blog-article { max-width: 48rem; margin: 0 auto; }
.ns-blog-hero {
    border-radius: 1.1rem;
    overflow: hidden;
    margin-bottom: 1.25rem;
    background: #f1f5f9;
    aspect-ratio: 16 / 9;
}
.ns-blog-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.ns-blog-article-head { margin-bottom: 1.25rem; }
.ns-blog-article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-top: 0.75rem;
    font-size: 0.86rem;
    color: #64748b;
}
.ns-blog-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.85rem;
}
.ns-blog-tag {
    display: inline-flex;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    background: var(--primary-50);
    color: var(--primary-700);
    font-size: 0.78rem;
    font-weight: 600;
}
.ns-blog-prose {
    font-size: 1rem;
    line-height: 1.95;
    color: #334155;
}
.ns-blog-prose p { margin: 0 0 1rem; }
.ns-blog-prose ul,
.ns-blog-prose ol { margin: 0 0 1rem; padding-inline-start: 1.25rem; }
.ns-blog-prose li { margin-bottom: 0.35rem; }
.ns-blog-prose a { color: var(--primary-700); text-decoration: underline; }
.ns-blog-prose strong { color: #0f172a; }

.ns-blog-comments {
    max-width: 48rem;
    margin: 2rem auto 0;
    padding-top: 1.5rem;
    border-top: 1px solid #e2e8f0;
}
.ns-blog-comments-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #0f172a;
}
.ns-blog-comment {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 0.85rem;
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
}
.ns-blog-comment--reply {
    margin-top: 0.65rem;
    margin-inline-start: 1rem;
    background: #f8fafc;
}
.ns-blog-comment strong { display: block; font-size: 0.9rem; color: #0f172a; }
.ns-blog-comment p { margin: 0.35rem 0; color: #334155; line-height: 1.7; }
.ns-blog-comment time { font-size: 0.78rem; color: #94a3b8; }
.ns-blog-comment-form h3 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
}
.ns-blog-comment-form textarea.ns-input {
    min-height: 6rem;
    resize: vertical;
}

/* 404 */
.ns-404 {
    text-align: center;
    padding: 64px 16px;
}
.ns-404 h1 {
    font-size: 3rem;
    color: var(--primary-600);
    margin-bottom: 8px;
    font-weight: 800;
}
.ns-404 p {
    color: #475569;
    margin-bottom: 24px;
}

/* CMS pages + shortcodes — about / contact */
.ns-cms-band {
    padding-bottom: var(--space-2xl);
}
.ns-cms-band--about,
.ns-cms-band--contact {
    background:
        radial-gradient(1000px 480px at 100% -10%, color-mix(in srgb, var(--primary-200) 35%, transparent), transparent 55%),
        radial-gradient(800px 400px at -5% 20%, color-mix(in srgb, var(--primary-100) 50%, transparent), transparent 50%),
        linear-gradient(180deg, #fff 0%, var(--bg) 48%, var(--bg) 100%);
}

/* Hero: only vertical rhythm — horizontal padding comes from .ns-width */
.ns-cms-hero {
    padding-block: clamp(1.75rem, 4.5vw, 2.75rem) clamp(1.25rem, 3vw, 1.75rem);
    padding-inline: 0;
}
.ns-cms-hero .ns-breadcrumb {
    margin-bottom: var(--space-md);
}
.ns-cms-kicker {
    display: inline-flex;
    align-items: center;
    margin: 0 0 var(--space-sm);
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    background: color-mix(in srgb, var(--primary-50) 90%, #fff);
    border: 1px solid var(--primary-100);
    color: var(--primary-700);
    font-size: 0.75rem;
    font-weight: 700;
}
.ns-cms-hero-title {
    margin: 0;
    font-size: clamp(1.75rem, 4.2vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
    color: var(--text);
}

.ns-cms--about,
.ns-cms--contact {
    padding-top: 0;
    padding-bottom: var(--space-xl);
}
.ns-cms {
    padding-top: var(--space-xl);
    padding-bottom: var(--space-2xl);
}
.ns-cms-head {
    margin-bottom: var(--space-lg);
    max-width: 40rem;
}
.ns-cms-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-2xl);
    padding: var(--space-lg);
    box-shadow: var(--shadow);
}
@media (min-width: 640px) {
    .ns-cms-panel { padding: var(--space-xl); }
}
.ns-cms-body {
    max-width: 42rem;
}
.ns-cms--contact .ns-cms-body,
.ns-cms--about .ns-cms-body {
    max-width: min(72rem, 100%);
}
.ns-cms-body > *:first-child { margin-top: 0; }
.ns-cms-body > *:last-child { margin-bottom: 0; }

.sc-lead {
    font-size: clamp(1.05rem, 2vw, 1.175rem);
    line-height: 1.8;
    color: var(--text);
    font-weight: 500;
    margin: 0 0 var(--space-lg);
    max-width: 40rem;
}
.sc-heading {
    margin: 0 0 var(--space-lg);
    max-width: 40rem;
}
.sc-heading-title {
    margin: 0;
    font-size: clamp(1.15rem, 2.2vw, 1.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.35;
    color: var(--text);
}
.sc-heading-text {
    margin: 0.4rem 0 0;
    font-size: 0.9375rem;
    line-height: 1.65;
    color: var(--muted);
}
.sc-heading-text:empty { display: none; }
.sc-prose {
    margin: 0 0 var(--space-lg);
    max-width: 42rem;
    font-size: 0.975rem;
    line-height: 1.85;
    color: var(--muted);
}

/* plain = open layout (no nested card chrome) */
.sc-section {
    margin: 0 0 clamp(1.5rem, 3.5vw, 2.25rem);
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    border-radius: 0;
}
.sc-section[data-tone="soft"] {
    padding: clamp(1.15rem, 2.5vw, 1.75rem);
    border-radius: var(--radius-2xl);
    background: color-mix(in srgb, var(--primary-50) 65%, #fff);
    border: 1px solid var(--primary-100);
    box-shadow: none;
}
.sc-section[data-tone="cta"] {
    padding: clamp(1.5rem, 4vw, 2.25rem);
    border-radius: var(--radius-2xl);
    background: linear-gradient(145deg, var(--primary-700), var(--primary-600));
    border: none;
    color: #fff;
    text-align: center;
}
.sc-section[data-tone="cta"] .sc-heading {
    margin-inline: auto;
    max-width: 32rem;
}
.sc-section[data-tone="cta"] .sc-heading-title { color: #fff; }
.sc-section[data-tone="cta"] .sc-heading-text { color: color-mix(in srgb, #fff 82%, transparent); }
.sc-section[data-tone="cta"] .sc-cta {
    background: #fff;
    color: var(--primary-700) !important;
    box-shadow: var(--shadow-md);
}
.sc-section[data-tone="cta"] .sc-cta:hover {
    background: #fff;
    color: var(--primary-600) !important;
    transform: translateY(-1px);
}
.sc-section[data-tone="cta"] .sc-cta:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
}
.sc-section > *:last-child { margin-bottom: 0; }

.sc-split {
    display: grid;
    gap: var(--space-lg);
    margin: 0 0 clamp(1.5rem, 3.5vw, 2.25rem);
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    align-items: center;
}
@media (min-width: 900px) {
    .sc-split {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
        gap: clamp(1.5rem, 3vw, 2.5rem);
    }
    /* RTL: copy on inline-start, media on the end */
    .sc-split-body { order: -1; }
}
.sc-split-media {
    margin: 0;
    border-radius: var(--radius-2xl);
    overflow: hidden;
    background: var(--color-muted, #f1f5f9);
    aspect-ratio: 4 / 3;
    box-shadow: var(--shadow-md);
}
.sc-split-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.sc-split-body .sc-lead { margin-bottom: var(--space-md); }
.sc-split-body .sc-cta-wrap { margin: 0; }

.ns-cms .sc-image,
.sc-image {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: var(--radius-xl);
    margin: 0 0 var(--space-xl);
    object-fit: cover;
    aspect-ratio: 16 / 9;
    background: var(--color-muted, #f1f5f9);
    box-shadow: var(--shadow);
}
.sc-grid {
    display: grid;
    gap: var(--space-md);
    margin: 0 0 var(--space-lg);
}
.sc-grid-1-2,
.sc-grid-1-3 {
    grid-template-columns: 1fr;
}
@media (min-width: 640px) {
    .sc-grid-1-2 { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 900px) {
    .sc-grid-1-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
}

.sc-feature {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
    padding: var(--space-md);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    min-height: 100%;
    box-shadow: none;
    transition: border-color var(--motion) var(--ease), background var(--motion) var(--ease);
}
.sc-section[data-tone="soft"] .sc-feature {
    background: #fff;
    border-color: color-mix(in srgb, var(--primary-100) 80%, var(--border));
}
.sc-feature:hover {
    border-color: var(--primary-200);
    background: #fff;
}
.sc-feature-icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.85rem;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: var(--primary-50);
    color: var(--primary-700);
    border: 1px solid var(--primary-100);
}
.sc-feature-icon i,
.sc-feature-icon svg {
    width: 1.2rem;
    height: 1.2rem;
}
.sc-feature-icon:has([data-lucide=""]) { display: none; }
.sc-feature-copy { min-width: 0; }
.sc-feature-title {
    display: block;
    font-size: 0.975rem;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: var(--space-xs);
}
.sc-feature-text {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.7;
    color: var(--muted);
}

.sc-contact-item {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    min-height: 4.5rem;
    text-decoration: none !important;
    color: inherit !important;
    box-shadow: none;
    transition: border-color var(--motion) var(--ease), background var(--motion) var(--ease);
}
.sc-contact-item:hover {
    border-color: var(--primary-200);
    background: #fff;
    color: inherit !important;
}
.sc-contact-item:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.sc-contact-icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.85rem;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: var(--primary-50);
    color: var(--primary-700);
    border: 1px solid var(--primary-100);
}
.sc-contact-icon i,
.sc-contact-icon svg {
    width: 1.2rem;
    height: 1.2rem;
}
.sc-contact-icon:has([data-lucide=""]) { display: none; }
.sc-contact-copy {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 0;
    flex: 1;
}
.sc-contact-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    line-height: 1.35;
}
.sc-contact-value {
    font-size: 0.975rem;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text) !important;
    text-decoration: none !important;
    word-break: break-word;
}
.sc-contact-item:hover .sc-contact-value {
    color: var(--primary-700) !important;
}
.sc-contact-go {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    border-radius: 999px;
    background: var(--primary-50);
    color: var(--primary-700);
    flex-shrink: 0;
    transition: transform var(--motion-fast) var(--ease);
}
.sc-contact-go i,
.sc-contact-go svg { width: 1rem; height: 1rem; }
.sc-contact-item:hover .sc-contact-go {
    transform: translateX(-2px);
}

.sc-note {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
    margin: 0 0 var(--space-lg);
    padding: var(--space-md);
    border-radius: var(--radius-xl);
    border: 1px solid var(--primary-100);
    border-inline-start: 3px solid var(--primary-600);
    background: var(--primary-50);
    color: var(--primary-700);
}
.sc-note-icon {
    width: 2rem;
    height: 2rem;
    border-radius: 999px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: #fff;
    color: var(--primary-700);
}
.sc-note-icon i,
.sc-note-icon svg {
    width: 1rem;
    height: 1rem;
}
.sc-note-text {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.7;
    color: var(--text);
}

.sc-cta-wrap {
    margin: var(--space-sm) 0 0;
}
.sc-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    min-height: 2.85rem;
    padding: 0.65rem 1.35rem;
    border-radius: var(--radius);
    background: var(--primary-600);
    color: #fff !important;
    font-weight: 700;
    font-size: 0.9rem;
    line-height: 1.25;
    text-decoration: none !important;
    box-shadow: var(--shadow);
    transition:
        background var(--motion) var(--ease),
        box-shadow var(--motion) var(--ease),
        transform var(--motion-fast) var(--ease);
}
.sc-cta i,
.sc-cta svg {
    width: 1rem;
    height: 1rem;
}
.sc-cta:hover {
    background: var(--primary-700);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
    color: #fff !important;
}
.sc-cta:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
}
.sc-cta:active { transform: translateY(0); }

.ns-cms-block {
    margin-top: var(--space-xl);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--border);
}
.ns-cms .ns-prose p {
    margin: 0 0 var(--space-md);
    max-width: 40rem;
    line-height: 1.8;
    color: var(--muted);
    font-size: 0.9375rem;
}
.ns-cms .ns-prose h2 {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: var(--space-xl) 0 var(--space-md);
}

@media (prefers-reduced-motion: reduce) {
    .sc-feature,
    .sc-contact-item,
    .sc-cta,
    .sc-contact-go {
        transition: none;
    }
    .sc-cta:hover,
    .sc-contact-item:hover .sc-contact-go {
        transform: none;
    }
}

/* ——— Taste + Pro Max polish layer ——— */
.ns-skip-link {
    position: absolute;
    inset-inline-start: var(--space-md);
    top: -100px;
    z-index: 10000;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    background: var(--primary-700);
    color: #fff !important;
    font-weight: 700;
    font-size: 0.875rem;
    box-shadow: var(--shadow-lg);
    transition: top var(--motion-fast) var(--ease);
}
.ns-skip-link:focus,
.ns-skip-link:focus-visible {
    top: var(--space-md);
    outline: 2px solid #fff;
    outline-offset: 2px;
}

.ns-page-title,
.ns-section-head h2,
.ns-discount-copy h2,
.ns-account-hero h1 {
    letter-spacing: -0.02em;
    line-height: 1.25;
}
.ns-page-title {
    font-size: clamp(1.35rem, 2.4vw, 1.85rem);
}
.ns-section {
    padding-block: var(--section-gap);
}
.ns-section-head {
    margin-bottom: clamp(1rem, 2vw, 1.5rem);
}
.ns-section-sub,
.ns-page-sub {
    color: var(--muted);
    max-width: 42rem;
}

.ns-btn:active:not(:disabled):not(.is-disabled) {
    transform: translateY(1px);
}
.ns-btn--ghost:active {
    transform: translateY(1px);
}

/* Skeleton shimmer */
.ns-skeleton {
    position: relative;
    overflow: hidden;
    background: #e2e8f0;
    border-radius: var(--radius);
    color: transparent !important;
    pointer-events: none;
    user-select: none;
}
.ns-skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(100%);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent
    );
    animation: ns-shimmer 1.2s var(--ease) infinite;
}
.ns-skeleton-stack {
    display: grid;
    gap: var(--space-md);
}
.ns-skeleton-card {
    min-height: 8.5rem;
    border-radius: var(--radius-xl);
}
.ns-skeleton-line {
    height: 0.85rem;
    width: 100%;
}
.ns-skeleton-line--sm { width: 42%; }
.ns-skeleton-line--md { width: 68%; }
@keyframes ns-shimmer {
    100% { transform: translateX(-100%); }
}
@media (prefers-reduced-motion: reduce) {
    .ns-skeleton::after { animation: none; }
}

/* Staggered reveal for grids */
@keyframes ns-fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
