{% extends "base.html" %}
{% block title %}{{ store.name }} - سفارشات{% endblock %}
{% block content %}
<div class="ns-account ns-width">
    {% include "partials/account_nav.html" with active="orders" %}
    <div class="ns-account-main" id="orders-page">
        <header class="ns-account-head">
            <h1 class="page-title">سفارشات من</h1>
            <p class="ns-account-sub">وضعیت، مبلغ و جزئیات خریدهایتان را اینجا پیگیری کنید.</p>
        </header>
        <div id="orders-list" class="orders-list" aria-live="polite">
            <div class="ns-loading-panel" aria-busy="true" aria-label="در حال بارگذاری سفارشات">
                <div class="ns-skeleton-stack ns-orders-skeleton">
                    <div class="ns-skeleton ns-skeleton-card"></div>
                    <div class="ns-skeleton ns-skeleton-card"></div>
                    <div class="ns-skeleton ns-skeleton-card"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/orders.js"></script>
{% endblock %}
