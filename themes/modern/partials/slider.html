<section class="cms-slider" style="padding:0; overflow:hidden;">
    <div class="slider-track">
        {% for slide in cms_slider.slides %}
        <a href="{{ slide.link|default:'#' }}" class="slide">
            <img src="{{ slide.image }}" alt="{{ slide.title }}">
            {% if slide.title %}
            <div class="slide-caption">
                <h2>{{ slide.title }}</h2>
                {% if slide.subtitle %}<p>{{ slide.subtitle }}</p>{% endif %}
            </div>
            {% endif %}
        </a>
        {% endfor %}
    </div>
</section>
<style>
.cms-slider { margin-bottom: 0; }
.slider-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.slider-track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; position: relative; scroll-snap-align: start; }
.slide img { width: 100%; height: min(78vh, 720px); object-fit: cover; display: block; }
.slide-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: clamp(1.5rem, 4vw, 3rem);
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
    color: #fff;
}
.slide-caption h2 {
    font-family: var(--vg-display, "Yekan", "IRANYekan", Tahoma, sans-serif);
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 600;
}
@media (max-width: 960px) {
    .slide img { height: min(58vh, 480px); }
}
</style>
