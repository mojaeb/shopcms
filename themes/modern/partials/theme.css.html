<style>
@font-face {
    font-family: "IRANYekan";
    src: url("/static/themes/round/fonts/iranyekanweblightfanum.woff") format("woff");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "IRANYekan";
    src: url("/static/themes/round/fonts/iranyekanwebregularfanum.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "IRANYekan";
    src: url("/static/themes/round/fonts/iranyekanwebmediumfanum.woff") format("woff");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "IRANYekan";
    src: url("/static/themes/round/fonts/iranyekanwebboldfanum.woff") format("woff");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-thin.ttf") format("truetype");
    font-weight: 100;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-light.ttf") format("truetype");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-heavy.ttf") format("truetype");
    font-weight: 800;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Yekan";
    src: url("/static/themes/round/fonts/yekan-fat.ttf") format("truetype");
    font-weight: 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --primary: #111111;
    --accent: #111111;
    --bg: #ffffff;
    --card: #ffffff;
    --text: #111111;
    --muted: #757575;
    --border: #e8e8e8;
    --radius: 0;
    --shadow: none;
    --shadow-lg: none;
    --font: "IRANYekan", "Yekan", Tahoma, sans-serif;
    --vg-display: "Yekan", "IRANYekan", Tahoma, sans-serif;
    --vg-soft: #f6f4f1;
    --vg-ink: #111111;
    --container: 1320px;
}

body.theme-modern {
    background: #fff;
    color: var(--vg-ink);
    font-family: var(--font);
}

body.theme-modern .site-main {
    max-width: none;
    padding: 0;
    width: 100%;
}

body.theme-modern .site-header { display: none; }

body.theme-modern [x-cloak] { display: none !important; }

.vg-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    color: var(--vg-ink);
}

.vg-header-bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1.5rem 2rem;
    min-height: 4.25rem;
    padding-block: 0.65rem;
}

.vg-brand-link {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: inherit;
    min-width: 0;
}

.vg-brand-link:hover { text-decoration: none; opacity: 0.85; }

.vg-logo-img {
    width: 2.25rem;
    height: 2.25rem;
    object-fit: contain;
    display: block;
}

.vg-logo-mark {
    width: 2.25rem;
    height: 2.25rem;
    display: grid;
    place-items: center;
    background: #111;
    color: #fff;
    font-family: var(--vg-display);
    font-size: 1rem;
    font-weight: 600;
    flex-shrink: 0;
}

.vg-logo-name {
    font-family: var(--vg-display);
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
}

.vg-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.15rem 1.35rem;
    min-width: 0;
}

.vg-nav a {
    color: var(--vg-ink);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 0.35rem 0;
    position: relative;
    opacity: 1;
}

.vg-nav a:hover {
    text-decoration: none;
    opacity: 0.65;
}

.vg-nav a::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: currentColor;
    transition: width 0.25s ease;
}

.vg-nav a:hover::after { width: 100%; }

.vg-header-actions {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    justify-self: end;
}

.vg-icon-btn {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    text-decoration: none;
    border-radius: 0;
    padding: 0;
}

.vg-icon-btn:hover {
    background: #f4f4f4;
    text-decoration: none;
    color: inherit;
}

.vg-icon-btn svg {
    width: 1.2rem;
    height: 1.2rem;
    stroke: currentColor;
}

.vg-cart-btn { overflow: visible; }

.vg-cart-chip {
    position: absolute;
    top: 0.15rem;
    left: 0.15rem;
    min-width: 1.1rem;
    height: 1.1rem;
    padding: 0 0.28rem;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1.1rem;
    text-align: center;
    display: none;
}

.vg-login-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.35rem;
    padding: 0 1rem;
    background: #111;
    color: #fff;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
}

.vg-login-btn:hover {
    background: #333;
    color: #fff;
    text-decoration: none;
}

.vg-nav-toggle {
    display: none;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    justify-self: end;
}

.vg-nav-toggle svg {
    width: 1.2rem;
    height: 1.2rem;
}

.vg-search-panel {
    border-top: 1px solid var(--border);
    background: #fff;
    overflow: hidden;
}

.vg-search-form {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 0.65rem;
    padding: 0.85rem 0;
}

.vg-search-form-icon {
    width: 1.25rem;
    height: 1.25rem;
    opacity: 0.45;
}

.vg-search-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.55rem 0;
    color: var(--vg-ink);
}

.vg-search-input::placeholder { color: #9a9a9a; }

.vg-search-submit {
    border: none;
    background: #111;
    color: #fff;
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.65rem 1.1rem;
    cursor: pointer;
}

.vg-search-submit:hover { background: #333; }

.vg-search-close { border: 1px solid var(--border); }

@media (max-width: 960px) {
    .vg-header-bar {
        grid-template-columns: 1fr auto auto;
        gap: 0.65rem;
    }

    .vg-nav-toggle { display: grid; }

    .vg-nav {
        display: none;
        grid-column: 1 / -1;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding-bottom: 0.5rem;
    }

    .vg-nav.is-open { display: flex; }

    .vg-nav a {
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
    }

    .vg-nav a::after { display: none; }

    .vg-search-form {
        grid-template-columns: auto 1fr auto;
        grid-template-areas:
            "icon input close"
            "submit submit submit";
    }

    .vg-search-form-icon { grid-area: icon; }
    .vg-search-input { grid-area: input; }
    .vg-search-close { grid-area: close; }
    .vg-search-submit { grid-area: submit; width: 100%; }
}

body.theme-modern .btn {
    background: #111;
    border-radius: 0;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.8rem;
}

body.theme-modern .btn-outline {
    background: transparent;
    border-color: #111;
    color: #111;
}

body.theme-modern .btn-outline:hover {
    background: #111;
    color: #fff;
}

body.theme-modern .card {
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
}

body.theme-modern .site-footer { display: none; }

.vg-width {
    width: min(100% - 2rem, var(--container));
    margin-inline: auto;
}

.vg-announce {
    background: #111;
    color: rgba(255, 255, 255, 0.88);
    text-align: center;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 0.55rem 1rem;
}

.vg-section {
    padding: clamp(2.75rem, 6vw, 5rem) 0;
}

.vg-section--tight { padding: 1.75rem 0 2.75rem; }
.vg-section--soft { background: var(--vg-soft); }

.vg-sec-head {
    text-align: center;
    margin-bottom: clamp(1.75rem, 4vw, 2.75rem);
}

.vg-sttl {
    font-family: var(--vg-display);
    font-size: clamp(1.85rem, 3.5vw, 2.7rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
}

.vg-sbttl {
    color: var(--muted);
    margin-top: 0.65rem;
    font-size: 0.98rem;
}

.vg-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.95rem 1.7rem;
    background: #111;
    color: #fff;
    border: 1px solid #111;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    cursor: pointer;
}

.vg-btn svg {
    width: 1rem;
    height: 1rem;
    stroke: currentColor;
}

.vg-btn:hover {
    background: #333;
    color: #fff;
    text-decoration: none;
    transform: translateY(-1px);
}

.vg-btn--ghost {
    background: transparent;
    color: #111;
}

.vg-btn--ghost:hover {
    background: #111;
    color: #fff;
}

.vg-btn--on-dark {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.75);
}

.vg-btn--on-dark:hover {
    background: #fff;
    color: #111;
}

.vg-hero {
    position: relative;
    margin: 0;
    isolation: isolate;
}

.vg-hero .cms-slider,
.vg-hero .cms-slider.card {
    margin: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
}

.vg-hero .slide img {
    height: min(82vh, 760px);
    object-fit: cover;
}

.vg-hero .slide-caption { display: none; }

.vg-hero-overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    color: #fff;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.48));
    pointer-events: none;
    z-index: 2;
}

.vg-hero-overlay-inner {
    pointer-events: auto;
    animation: vg-rise 0.85s ease both;
}

.vg-brand {
    font-family: var(--vg-display);
    font-size: clamp(2.8rem, 8vw, 5rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 0.85rem;
}

.vg-hero--fallback {
    min-height: min(82vh, 760px);
    display: grid;
    place-items: center;
    background:
        linear-gradient(120deg, rgba(17, 17, 17, 0.5), rgba(17, 17, 17, 0.25)),
        url("https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1800&q=80") center/cover;
    color: #fff;
    text-align: center;
}

.vg-hero-fallback-inner {
    padding: 4rem 1rem;
    animation: vg-rise 0.85s ease both;
}

.vg-eyebrow-dark {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.85rem;
}

.vg-lead {
    max-width: 28rem;
    margin: 0 auto 1.75rem;
    opacity: 0.92;
    font-size: 1.08rem;
    line-height: 1.55;
}

.vg-hero-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
}

/* Theme-settings hero: split half page (image right / copy left in RTL) */
.vg-hero--theme {
    isolation: isolate;
}

.vg-theme-slider {
    margin: 0;
    overflow: hidden;
}

.vg-theme-slider-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

.vg-theme-slider-track::-webkit-scrollbar {
    display: none;
}

.vg-theme-slide {
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: min(72vh, 640px);
    background: var(--slide-bg, #f6f4f1);
}

.vg-theme-slide-media {
    position: relative;
    min-height: min(72vh, 640px);
    overflow: hidden;
    background: #e8e4df;
}

.vg-theme-slide-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: blur(8px);
    transform: scale(1.04);
    transition: filter 0.45s ease, transform 0.45s ease;
}

.vg-theme-slide-img.is-loaded {
    filter: none;
    transform: none;
}

.vg-theme-slide-placeholder {
    width: 100%;
    height: 100%;
    min-height: min(72vh, 640px);
    background: linear-gradient(135deg, #ddd8d2, #cfc8c0);
}

.vg-theme-slide-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.75rem, 5vw, 4rem);
    color: var(--vg-ink);
}

.vg-theme-slide-title {
    font-family: var(--vg-display);
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
}

.vg-theme-slide-text {
    max-width: 28rem;
    margin: 0 0 1.75rem;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--muted);
}

@keyframes vg-rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.vg-collections {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 1.5rem;
    justify-items: center;
}

.vg-collections--fallback {
    max-width: 520px;
    margin-inline: auto;
    grid-template-columns: repeat(3, 1fr);
}

.vg-collection {
    text-align: center;
    color: inherit;
    text-decoration: none;
    width: 100%;
    max-width: 180px;
}

.vg-collection:hover {
    text-decoration: none;
    color: inherit;
}

.vg-collection-img {
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: var(--vg-soft);
    margin-bottom: 0.9rem;
    transition: transform 0.4s ease;
}

.vg-collection:hover .vg-collection-img {
    transform: scale(1.05);
}

.vg-collection-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.vg-collection-placeholder {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    font-family: var(--vg-display);
    font-size: 1.35rem;
    color: #888;
    padding: 0.5rem;
    text-align: center;
}

.vg-collection h3 {
    font-size: 0.95rem;
    font-weight: 500;
}

.vg-products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.35rem;
}

.vg-product {
    color: inherit;
    text-decoration: none;
}

.vg-product:hover {
    text-decoration: none;
    color: inherit;
}

.vg-product-media {
    position: relative;
    aspect-ratio: 3 / 4;
    background: #efefef;
    overflow: hidden;
    margin-bottom: 0.9rem;
}

.vg-product-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.vg-product:hover .vg-product-media img {
    transform: scale(1.06);
}

.vg-product-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, #ececec, #ddd);
}

.vg-product-hover {
    position: absolute;
    inset: auto 0 0 0;
    padding: 0.85rem;
    text-align: center;
    background: rgba(17, 17, 17, 0.88);
    color: #fff;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transform: translateY(100%);
    transition: transform 0.3s ease;
}

.vg-product:hover .vg-product-hover {
    transform: translateY(0);
}

.vg-product-cat {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
    letter-spacing: 0.04em;
}

.vg-product h3 {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
}

.vg-price {
    font-size: 0.92rem;
    color: #111;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
    flex-wrap: wrap;
}

.vg-price s {
    color: var(--muted);
    font-size: 0.85rem;
}

.vg-pill {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: #fff;
    color: #111;
    font-size: 0.72rem;
    padding: 0.25rem 0.5rem;
    letter-spacing: 0.04em;
    z-index: 1;
}

.vg-pill--feat {
    right: auto;
    left: 0.75rem;
    background: #111;
    color: #fff;
}

.vg-sec-cta {
    text-align: center;
    margin-top: 2.25rem;
}

.vg-empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
}

.vg-empty .vg-btn { margin-top: 1rem; }

.vg-banners {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
}

.vg-banner {
    position: relative;
    display: block;
    min-height: 260px;
    overflow: hidden;
    color: #fff;
    text-decoration: none;
    background: #222;
}

.vg-banner:hover { text-decoration: none; color: #fff; }

.vg-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    transition: transform 0.5s ease;
}

.vg-banner:hover img { transform: scale(1.05); }

.vg-banner-copy {
    position: absolute;
    inset: auto 0 0 0;
    padding: 1.4rem;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
}

.vg-banner-copy strong {
    font-family: var(--vg-display);
    font-size: 1.45rem;
    font-weight: 600;
}

.vg-banner-copy span {
    font-size: 0.9rem;
    opacity: 0.9;
}

.vg-editorial {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    min-height: 420px;
}

.vg-editorial-media {
    background:
        linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.12)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=80") center/cover;
}

.vg-editorial-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 5vw, 4rem);
    background: var(--vg-soft);
}

.vg-editorial-copy p:not(.vg-eyebrow-dark) {
    color: var(--muted);
    margin: 0.85rem 0 1.5rem;
    max-width: 28rem;
    line-height: 1.7;
}

.vg-trust {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
    text-align: center;
}

.vg-trust-item {
    padding: 1.75rem 1.1rem;
    border: 1px solid var(--border);
    transition: border-color 0.25s ease;
}

.vg-trust-item:hover { border-color: #111; }

.vg-trust-no {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 0.75rem;
}

.vg-trust-icon {
    display: inline-grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    margin-bottom: 0.85rem;
    border: 1px solid var(--border);
}

.vg-trust-icon svg {
    width: 1.2rem;
    height: 1.2rem;
