{% extends "base.html" %}
{% block title %}{{ store.name }} - سبد خرید{% endblock %}
{% block content %}
<div class="vg-page vg-width" id="cart-page" data-currency="{{ store.currency }}" data-vg-reveal>
    <div class="vg-page-head">
        <p class="vg-eyebrow-dark"><i data-lucide="shopping-cart"></i> سفارش</p>
        <h1 class="vg-page-title">سبد خرید</h1>
    </div>
    <div id="cart-container">
        <div class="vg-empty">
            <i data-lucide="loader-circle" class="vg-empty-icon"></i>
            <p>در حال بارگذاری...</p>
        </div>
    </div>
    <div id="cart-summary" style="margin-top:1rem;"></div>
</div>
{% endblock %}
