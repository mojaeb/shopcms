{% extends "base.html" %}
{% block title %}{{ store.name }} - سبد خرید{% endblock %}
{% block content %}
<div class="ps-page" id="cart-page" data-currency="{{ store.currency }}">
    <div class="gh-width">
        <header class="ps-cart-head">
            <p class="gh-kicker" style="letter-spacing:0.3em;font-size:0.75rem;margin-bottom:1rem;">CART</p>
            <h1 class="ps-page-title">سبد خرید</h1>
            <p class="ps-page-sub">اقلام انتخابی را بررسی کنید و برای تسویه ادامه دهید.</p>
        </header>

        <div class="ps-product-trust" style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:2rem 0;" aria-label="مزایای خرید">
            <span><i data-lucide="shield-check" aria-hidden="true"></i> پرداخت امن</span>
            <span><i data-lucide="rotate-ccw" aria-hidden="true"></i> ضمانت اصالت</span>
            <span><i data-lucide="truck" aria-hidden="true"></i> ارسال رایگان</span>
        </div>

        <div class="ps-cart-layout">
            <div class="ps-cart-main">
                <div id="cart-container">
                    <div class="ps-empty" aria-busy="true">در حال بارگذاری سبد خرید...</div>
                </div>

                <section class="ps-surface ps-cart-coupon" data-ps-cart-tools hidden aria-label="کد تخفیف و کارت هدیه">
                    <h2 class="ps-cart-section-title">
                        <i data-lucide="ticket-percent" aria-hidden="true"></i>
                        کد تخفیف / کارت هدیه
                    </h2>
                    <div class="ps-cart-coupon-row">
                        <input type="text" id="coupon-code" class="ps-input" placeholder="کد کوپن" aria-label="کد کوپن" autocomplete="off">
                        <button type="button" class="btn-gold" id="apply-coupon">اعمال</button>
                        <button type="button" class="btn-ghost" id="remove-coupon">حذف</button>
                    </div>
                    <div class="ps-cart-coupon-row">
                        <input type="text" id="gift-code" class="ps-input" placeholder="کد کارت هدیه" aria-label="کد کارت هدیه" autocomplete="off">
                        <button type="button" class="btn-gold" id="apply-gift">اعمال</button>
                        <button type="button" class="btn-ghost" id="remove-gift">حذف</button>
                    </div>
                    <p id="coupon-message" class="ps-page-sub ps-cart-coupon-msg" role="status"></p>
                </section>
            </div>

            <aside class="ps-cart-aside" aria-label="خلاصه سبد">
                <div id="cart-summary"></div>
            </aside>
        </div>
    </div>
</div>
{% endblock %}
