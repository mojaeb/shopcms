{% extends "base.html" %}
{% block title %}{{ store.name }} - سبد خرید{% endblock %}
{% block content %}
<div class="ps-page" id="cart-page" data-currency="{{ store.currency }}">
    <div class="gh-width">
        <header class="ps-cart-head">
            <p class="gh-kicker" style="letter-spacing:0.3em;font-size:0.75rem;margin-bottom:1rem;">CART</p>
            <h1 class="ps-page-title">سبد خرید</h1>
            <p class="ps-page-sub">اقلام انتخابی را بررسی کنید و برای تسویه ادامه دهید.</p>
        </header>

        <div class="ps-product-trust" style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:2rem 0;" aria-label="مزایای خرید">
            <span><i data-lucide="shield-check" aria-hidden="true"></i> پرداخت امن</span>
            <span><i data-lucide="rotate-ccw" aria-hidden="true"></i> ضمانت اصالت</span>
            <span><i data-lucide="truck" aria-hidden="true"></i> ارسال رایگان</span>
        </div>

        <div class="ps-cart-layout">
            <div class="ps-cart-main">
                <div id="cart-container">
                    <div class="ps-empty" aria-busy="true">در حال بارگذاری سبد خرید...</div>
                </div>
            </div>

            <aside class="ps-cart-aside" aria-label="خلاصه سبد">
                <div id="cart-summary"></div>
            </aside>
        </div>
    </div>
</div>
{% endblock %}
