{% extends "base.html" %}
{% block title %}{{ store.name }} - سبد خرید{% endblock %}
{% block content %}
<div class="mn-page" id="cart-page" data-currency="{{ store.currency }}">
    <header class="mn-page-head">
        <h1 class="mn-page-title">سبد خرید</h1>
        <p class="mn-page-desc">اقلام انتخاب‌شده را بررسی کنید و برای تسویه ادامه دهید.</p>
    </header>

    <div id="cart-container">
        <div class="empty-state card">در حال بارگذاری...</div>
    </div>

    <div id="cart-summary" style="margin-top:1rem;"></div>
</div>
{% endblock %}
