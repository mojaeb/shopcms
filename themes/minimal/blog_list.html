{% extends "base.html" %}
{% block title %}{{ store.name }} - وبلاگ{% endblock %}
{% block extra_css %}
<style>
.blog-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:1.5rem; }
.blog-card { display:block; color:inherit; }
.blog-card:hover { text-decoration:none; color:inherit; }
.blog-card img { width:100%; aspect-ratio:16/10; object-fit:cover; background:var(--mn-soft, #f4f4f5); }
.blog-card h3 { margin-top:0.85rem; font-family:var(--font-display, inherit); font-size:1.05rem; letter-spacing:-0.02em; }
</style>
{% endblock %}
{% block content %}
<div class="mn-page" id="blog-list-page">
    <header class="mn-page-head">
        <h1 class="mn-page-title">وبلاگ</h1>
        <p class="mn-page-desc">نکات، اخبار و محتوای منتخب فروشگاه</p>
    </header>
    <div class="mn-blog-filters blog-filters" id="blog-categories"></div>
    <div id="blog-posts">
        <div class="empty-state card">در حال بارگذاری...</div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/blog.js"></script>
{% endblock %}
