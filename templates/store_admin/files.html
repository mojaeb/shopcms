{% extends "store_admin/base.html" %}
{% block content %}
<div id="sa-files" class="sa-page">
    <div class="sa-upload-zone" id="upload-zone">
        <p>تصویر یا فایل را بکشید و رها کنید، یا از دکمه انتخاب کنید.</p>
        <input type="file" id="file-input" accept="image/*,video/*,application/pdf" multiple hidden>
        <button type="button" class="sa-btn" id="file-pick">انتخاب فایل</button>
        <div class="sa-upload-fields">
            <label>عنوان
                <input type="text" id="upload-title" class="sa-input" placeholder="اختیاری">
            </label>
            <label>پوشه
                <input type="text" id="upload-folder" class="sa-input" placeholder="مثلاً products">
            </label>
            <label>متن جایگزین (alt)
                <input type="text" id="upload-alt" class="sa-input" placeholder="اختیاری">
            </label>
        </div>
    </div>

    <div class="sa-toolbar">
        <select id="filter-type" class="sa-input sa-input-auto">
            <option value="">همه انواع</option>
            <option value="image">تصویر</option>
            <option value="video">ویدیو</option>
            <option value="document">سند</option>
            <option value="other">سایر</option>
        </select>
        <input type="search" id="filter-folder" placeholder="فیلتر پوشه..." class="sa-input">
        <button type="button" class="sa-btn sa-btn-ghost" id="filter-apply">اعمال فیلتر</button>
    </div>

    <div id="files-grid-wrap" class="sa-loading-host"></div>
    <div class="sa-pager" id="files-pager" hidden>
        <button type="button" class="sa-btn sa-btn-ghost sa-btn-sm" id="page-prev">قبلی</button>
        <span id="page-label" class="sa-muted"></span>
        <button type="button" class="sa-btn sa-btn-ghost sa-btn-sm" id="page-next">بعدی</button>
    </div>

    <dialog id="file-dialog" class="sa-dialog">
        <form id="file-form" class="sa-form">
            <h2>جزئیات فایل</h2>
            <input type="hidden" id="file-id" value="">
            <div id="file-preview-wrap"></div>

            <label>شناسه (ID)
                <div class="sa-copy-row">
                    <input type="text" id="detail-id" class="sa-input" readonly>
                    <button type="button" class="sa-btn sa-btn-ghost sa-btn-sm" data-copy="detail-id">کپی</button>
                </div>
            </label>
            <label>لینک (URL)
                <div class="sa-copy-row">
                    <input type="text" id="detail-url" class="sa-input" readonly>
                    <button type="button" class="sa-btn sa-btn-ghost sa-btn-sm" data-copy="detail-url">کپی</button>
                </div>
            </label>
            <label>نام اصلی
                <input type="text" id="detail-name" class="sa-input" readonly>
            </label>
            <div class="sa-grid-2">
                <label>نوع
                    <input type="text" id="detail-type" class="sa-input" readonly>
                </label>
                <label>حجم
                    <input type="text" id="detail-size" class="sa-input" readonly>
                </label>
                <label>ابعاد
                    <input type="text" id="detail-dims" class="sa-input" readonly>
                </label>
                <label>MIME
                    <input type="text" id="detail-mime" class="sa-input" readonly>
                </label>
            </div>
            <label>عنوان
                <input type="text" id="detail-title" class="sa-input">
            </label>
            <label>متن جایگزین (alt)
                <input type="text" id="detail-alt" class="sa-input">
            </label>
            <label>پوشه
                <input type="text" id="detail-folder" class="sa-input">
            </label>
            <div id="detail-thumbs" class="sa-muted sa-text-sm"></div>
            <div class="sa-form-actions">
                <button type="submit" class="sa-btn">ذخیره</button>
                <button type="button" class="sa-btn sa-btn-danger" id="file-delete">حذف</button>
                <button type="button" class="sa-btn sa-btn-ghost" id="file-close">بستن</button>
            </div>
        </form>
    </dialog>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/store_admin/files.js"></script>
{% endblock %}
