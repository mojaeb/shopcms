# VPS deployment — works behind Nginx Proxy Manager
# NPM handles SSL + routing; this stack exposes web on host port 8000.
#
# On server: docker compose -f docker/docker-compose.vps.yml up -d
#
# NPM proxy hosts:
#   shop1.yourdomain.com  → http://localhost:8000
#   gohar.yourdomain.com  → http://localhost:8000  (same app, tenant routing)

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -c docker/gunicorn.conf.py"
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      # Exposed on host — NPM proxies to this port
      - "127.0.0.1:8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    restart: unless-stopped
    command: celery -A config worker -l info -c 2
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SKIP_ENTRYPOINT_SETUP=1
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    depends_on:
      - db
      - redis

  celery-beat:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SKIP_ENTRYPOINT_SETUP=1
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shopcms
      POSTGRES_USER: shopcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcms -d shopcms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
  backup_volume:
  redis_data:
