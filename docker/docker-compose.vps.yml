# VPS deployment — works behind Nginx Proxy Manager or Traefik
# The proxy network (created by proxy/docker-compose.yml) connects NPM/Traefik to this stack.
#
# On server: docker compose -f docker/docker-compose.vps.yml up -d
#
# NPM proxy host:
#   shop.yourdomain.com  → http://shopcms-web:8000
# Traefik labels are already on the web service (set DOMAIN env var).

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    container_name: shopcms-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -c docker/gunicorn.conf.py"
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    # No host port binding — proxy network handles routing
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - proxy

  celery:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    restart: unless-stopped
    command: celery -A config worker -l info -c 2
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SKIP_ENTRYPOINT_SETUP=1
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    depends_on:
      - db
      - redis
    networks:
      - internal

  celery-beat:
    image: ghcr.io/${GHCR_OWNER:-youruser}/shopcms:latest
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://shopcms:${POSTGRES_PASSWORD}@db:5432/shopcms
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SKIP_ENTRYPOINT_SETUP=1
    depends_on:
      - db
      - redis
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shopcms
      POSTGRES_USER: shopcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcms -d shopcms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:
  backup_volume:
  redis_data:

networks:
  # Internal network — db, redis, celery only communicate here
  internal:
    internal: true
  # Shared proxy network — created by proxy/docker-compose.yml on the VPS
  proxy:
    name: proxy
    external: true
