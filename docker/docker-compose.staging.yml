services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "-c",
        "docker/gunicorn.conf.py",
      ]
    env_file:
      - ../.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DATABASE_URL: postgres://shopcms:${POSTGRES_PASSWORD:-shopcms}@db:5432/shopcms
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SEED_DATA_DIR: /seed
      LOAD_SEED_DATA: ${LOAD_SEED_DATA:-1}
      LOAD_SEED_MEDIA: ${LOAD_SEED_MEDIA:-1}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
      - ./seed-data:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file:
      - ../.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DATABASE_URL: postgres://shopcms:${POSTGRES_PASSWORD:-shopcms}@db:5432/shopcms
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SKIP_ENTRYPOINT_SETUP: "1"
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file:
      - ../.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DATABASE_URL: postgres://shopcms:${POSTGRES_PASSWORD:-shopcms}@db:5432/shopcms
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SKIP_ENTRYPOINT_SETUP: "1"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shopcms
      POSTGRES_USER: shopcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcms -d shopcms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  backup_volume:
